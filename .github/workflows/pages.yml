name: Refresh performance report history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: performance-pages
  cancel-in-progress: false

jobs:
  pages:
    uses: NeverMorewd/DotNetPerformanceLab/.github/workflows/deploy-pages.yml@9d2dc0a9c5fa97c437298e2ed058b7815b90cca1
    with:
      history-days: 30
      maximum-runs: 50
      toolkit-ref: 9d2dc0a9c5fa97c437298e2ed058b7815b90cca1
