name: Refresh performance report history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: performance-pages
  cancel-in-progress: false

jobs:
  pages:
    uses: NeverMorewd/DotNetPerformanceLab/.github/workflows/deploy-pages.yml@60d8baf1f537e516428414a358542a4185f95fe7
    with:
      history-days: 30
      maximum-runs: 50
      toolkit-ref: 60d8baf1f537e516428414a358542a4185f95fe7
