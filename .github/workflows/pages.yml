name: Refresh performance report history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: performance-pages
  cancel-in-progress: false

jobs:
  pages:
    uses: NeverMorewd/DotNetPerformanceLab/.github/workflows/deploy-pages.yml@ab345c85cb74e1c4a833047940f78a44634229f1
    with:
      history-days: 30
      maximum-runs: 50
      toolkit-ref: ab345c85cb74e1c4a833047940f78a44634229f1
