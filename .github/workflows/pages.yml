name: Refresh performance report history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: performance-pages
  cancel-in-progress: false

jobs:
  pages:
    uses: NeverMorewd/DotNetPerformanceLab/.github/workflows/deploy-pages.yml@d1410993f8d93bf5a2b768e2c8b4b95885f732c7
    with:
      history-days: 30
      maximum-runs: 50
      toolkit-ref: 561ba257288e950118be2bee5840e4e490b48fb1
